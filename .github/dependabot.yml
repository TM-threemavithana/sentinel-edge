version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      cloudflare:
        patterns: ["@cloudflare/*", "wrangler", "vinext", "@vinext/*"]
      testing:
        patterns: ["vitest", "@vitest/*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
