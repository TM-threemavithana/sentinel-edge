name: Feature request
description: Propose a focused product or developer-experience improvement
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user or operator problem should this solve?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe success without prescribing implementation details.
    validations:
      required: true
  - type: textarea
    id: security
    attributes:
      label: Security and cost considerations
      description: Note new trust boundaries, data handling, Cloudflare resources, or free-plan impact.
    validations:
      required: true
