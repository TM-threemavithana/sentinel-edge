name: Deploy to Cloudflare

on:
  workflow_dispatch:
  push:
    branches: [main, develop]
    paths:
      - "apps/**"
      - "packages/**"
      - "pnpm-lock.yaml"

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck && pnpm test
      - run: pnpm --filter @sentinel/security-core build

  staging:
    needs: validate
    if: github.ref_name == 'develop'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: staging
    env:
      GATEWAY_ORIGIN: "https://sentinel-edge-gateway-staging.tharukamaduwantha62.workers.dev"
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply D1 migrations (staging)
        run: pnpm --filter @sentinel/gateway db:migrate:staging
      - name: Deploy gateway (staging)
        run: pnpm --filter @sentinel/gateway deploy:staging
      - name: Deploy console (staging)
        run: pnpm --filter @sentinel/web deploy:staging
      - name: Verify staging health
        run: |
          curl --fail --silent --show-error --retry 5 --retry-delay 3 --retry-all-errors \
            https://sentinel-edge-gateway-staging.tharukamaduwantha62.workers.dev/health
          curl --fail --silent --show-error --retry 5 --retry-delay 3 --retry-all-errors \
            https://sentinel-edge-console-staging.tharukamaduwantha62.workers.dev/login > /dev/null

  production:
    needs: validate
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production
    env:
      GATEWAY_ORIGIN: "https://sentinel-edge-gateway-production.tharukamaduwantha62.workers.dev"
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply D1 migrations
        run: pnpm --filter @sentinel/gateway db:migrate:production
      - name: Deploy gateway
        run: pnpm --filter @sentinel/gateway deploy:production
      - name: Deploy console
        run: pnpm --filter @sentinel/web deploy:production
      - name: Verify production health
        run: |
          curl --fail --silent --show-error --retry 5 --retry-delay 3 --retry-all-errors \
            https://sentinel-edge-gateway-production.tharukamaduwantha62.workers.dev/health
          curl --fail --silent --show-error --retry 5 --retry-delay 3 --retry-all-errors \
            https://sentinel-edge-console.tharukamaduwantha62.workers.dev/login > /dev/null
