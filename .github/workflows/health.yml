name: Public health

on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  endpoints:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check production gateway
        run: curl --fail --silent --show-error --max-time 20 --retry 2 https://sentinel-edge-gateway-production.tharukamaduwantha62.workers.dev/health
      - name: Check public showcase
        run: curl --fail --silent --show-error --max-time 20 --retry 2 --output /dev/null https://sentinel-edge-console.tharukamaduwantha62.workers.dev/showcase
      - name: Check operator sign-in
        run: curl --fail --silent --show-error --max-time 20 --retry 2 --output /dev/null https://sentinel-edge-console.tharukamaduwantha62.workers.dev/login
