name: DAST

on:
  workflow_dispatch:
    inputs:
      target:
        description: Public staging or production console origin
        required: true
        default: https://sentinel-edge-console-staging.tharukamaduwantha62.workers.dev
        type: string
  schedule:
    - cron: "41 4 * * 3"

permissions:
  contents: read

jobs:
  zap-baseline:
    name: OWASP ZAP baseline
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Resolve scan target
        id: target
        shell: bash
        env:
          REQUESTED_TARGET: ${{ inputs.target }}
        run: |
          target="${REQUESTED_TARGET:-https://sentinel-edge-console-staging.tharukamaduwantha62.workers.dev}"
          case "$target" in
            https://sentinel-edge-console-staging.tharukamaduwantha62.workers.dev|https://sentinel-edge-console.tharukamaduwantha62.workers.dev)
              echo "url=$target" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Target must be an approved Sentinel Edge HTTPS origin" >&2
              exit 1
              ;;
          esac
      - name: Passive web security scan
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: ${{ steps.target.outputs.url }}
          docker_name: ghcr.io/zaproxy/zaproxy:stable
          cmd_options: -a -m 3
          fail_action: true
          allow_issue_writing: false
          artifact_name: sentinel-edge-zap-report
